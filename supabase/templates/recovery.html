<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Reset your password for Smart Waste Management System</title>
</head>
<body style="margin:0;padding:0;background:#fcfdfb;font-family:Arial,Helvetica,sans-serif;color:#14291f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fcfdfb;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#f8faf7;border:1px solid #e5e7ea;border-radius:16px;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background:#14291f;padding:32px 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="64" style="width:64px;vertical-align:middle;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="width:64px;height:64px;background:#ffffff;border-radius:14px;">
                          <img src="https://smartwastesad.lovable.app/email-logo.png" width="48" height="48" alt="Smart Waste" style="display:block;margin:0 auto;border:0;border-radius:8px;" />
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td style="padding-left:20px;vertical-align:middle;font-size:26px;line-height:32px;font-weight:700;color:#ffffff;letter-spacing:0.2px;">
                    SMART WASTE MANAGEMENT SYSTEM
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f8faf7;border:1px solid #e5e7ea;border-radius:16px;">
                <tr>
                  <td style="padding:32px 34px 8px 34px;font-size:17px;line-height:26px;color:#14291f;">
                    <p style="margin:0 0 22px 0;">Hey{{ if .Data.full_name }} {{ .Data.full_name }}{{ end }},</p>
                    <p style="margin:0;">Use this verification code to reset your password for Smart Waste Management System:</p>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:20px 34px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f8f9fa;border-radius:12px;">
                      <tr>
                        <td align="center" style="padding:34px 12px;font-family:Arial,Helvetica,sans-serif;font-size:44px;line-height:48px;font-weight:700;letter-spacing:14px;color:#14291f;">
                          {{ .Token }}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:8px 34px 8px 34px;font-size:17px;line-height:26px;color:#14291f;">
                    This code will expire in <strong>10 minutes.</strong>
                  </td>
                </tr>
                <tr>
                  <td style="padding:8px 34px 32px 34px;font-size:14px;line-height:22px;color:#6b7280;">
                    If you didn’t request this code, you can safely ignore this email.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr><td style="height:24px;line-height:24px;font-size:0;">&nbsp;</td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
